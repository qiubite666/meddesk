# ==============================================================================
# MedDesk —— 本地开发专用（仅起依赖，应用在宿主机上 go run）
# 用法：
#   docker compose -f deploy/docker-compose.dev.yml up -d     # 起 PG + Redis
#   docker compose -f deploy/docker-compose.dev.yml down      # 停止（保留数据卷）
#   docker compose -f deploy/docker-compose.dev.yml down -v   # 停止并清空数据
# 仅限本地开发：口令是硬编码的开发口令，禁止用于生产（生产见 docker-compose.yml）。
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: meddesk-dev-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: meddesk
      POSTGRES_PASSWORD: meddesk   # 开发口令，仅限本机
      POSTGRES_DB: meddesk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meddesk -d meddesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: meddesk-dev-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "devpass"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a devpass ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata_dev:
