# ==============================================================================
# MedDesk —— Docker Compose 一键方案（开发 / 自用快速起环境）
# 用法：
#   cp deploy/env.example .env && vim .env        # 必须替换所有占位符口令与 JWT 密钥
#   docker compose -f deploy/docker-compose.yml config        # 先做一次语法/插值校验
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml logs -f app
#
# 【适用 vs 不选】
#   适用：想快速验证功能、家庭 NAS / 小主机、能接受容器化运维的人。
#   不选：追求最小攻击面、已有 PostgreSQL 实例、希望用 systemd + journald 统一运维的人
#         —— 请走 deploy/systemd/meddesk.service 方案（见 docs/DEPLOYMENT.md 路径 B）。
#
# 【安全提醒】
#   1. postgres / redis / app 的端口**全部只映射在 127.0.0.1**，容器网络不出宿主机，
#      对外 HTTPS 必须由 Nginx 反代提供（见 deploy/nginx/meddesk.conf）。
#   2. 下面所有口令都是**占位符**，上线前必须替换，禁止使用默认 meddesk/meddesk。
#   3. compose 文件路径在 deploy/ 下，故 volumes 中的相对路径均相对 deploy/ 解析。
# ==============================================================================

name: meddesk

services:
  # ------------------------------------------------------------------ 数据库
  postgres:
    image: postgres:18-alpine
    container_name: meddesk-postgres
    restart: unless-stopped
    # 只监听回环，避免容器端口映射把 5432 暴露到宿主机公网网卡
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      # ====== 占位符！上线前必须替换：openssl rand -base64 24 ======
      POSTGRES_USER: meddesk
      POSTGRES_PASSWORD: "<PG_PASSWORD_请替换为随机串>"
      POSTGRES_DB: meddesk
      # 该变量仅在数据目录为空（首次初始化）时生效，之后修改不会重建库
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Shanghai
      PGDATA: /var/lib/postgresql/data/pgdata
    # 用命令行 -c 覆盖关键参数，避免依赖镜像是否支持 conf.d include_dir。
    # 完整调优说明见 deploy/postgres-tuning.conf（路径 B 的宿主机 PG 用那一份）。
    command: >
      postgres
      -c listen_addresses='*'
      -c max_connections=100
      -c shared_buffers=512MB
      -c effective_cache_size=1GB
      -c work_mem=8MB
      -c maintenance_work_mem=256MB
      -c wal_buffers=16MB
      -c checkpoint_timeout=15min
      -c max_wal_size=2GB
      -c min_wal_size=128MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c log_min_duration_statement=1000
      -c log_timezone='Asia/Shanghai'
      -c timezone='Asia/Shanghai'
    volumes:
      # 数据持久化：命名卷。docker compose down 不删；`down -v` 才会删除（危险！）
      - pgdata:/var/lib/postgresql/data
      # 首次初始化时执行的 SQL（建 citext 扩展等）；仅数据目录为空时执行一次。
      # 内容见 deploy/scripts/initdb/，不需要可整段注释掉。
      - ./scripts/initdb:/docker-entrypoint-initdb.d:ro
    # 2C4G 小机资源限制：给 PG 约 1G，其余留给 redis + app + 系统
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: 1.00
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meddesk -d meddesk -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - meddesk

  # ------------------------------------------------------------ 缓存 / 限流
  redis:
    image: redis:7-alpine
    container_name: meddesk-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      # 供容器健康检查里的 redis-cli 使用（注意：这里仍是一串占位符）
      REDISCLI_AUTH: "<REDIS_PASSWORD_请替换为随机串>"
    # 纯缓存语义：关闭 RDB/AOF。Redis 挂掉最坏情况是退化为进程内 Noop 实现
    # （限流与吊销名单在单实例内仍可用），数据本体始终在 PG 里。
    command: >
      redis-server
      --bind 127.0.0.1 -::1
      --appendonly no
      --save ""
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass "<REDIS_PASSWORD_请替换为随机串>"
    volumes:
      - redisdata:/data
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.50
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDISCLI_AUTH\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - meddesk

  # -------------------------------------------------------------------- 应用
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: meddesk:local
    container_name: meddesk-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8089:8089"
    # 仓库根目录的 .env（内容同 deploy/env.example）。注意：里面的 <...> 占位符必须先替换。
    env_file:
      - ../.env
    environment:
      # 容器网络内用服务名互访，**不能再写 127.0.0.1**
      MEDDESK_ENV: prod
      MEDDESK_HTTP_ADDR: ":8089"
      MEDDESK_TRUST_PROXY: "true"
      MEDDESK_DB_URL: "postgres://meddesk:<PG_PASSWORD_请替换为随机串>@postgres:5432/meddesk?sslmode=disable"
      MEDDESK_REDIS_ENABLED: "true"
      MEDDESK_REDIS_URL: "redis://:<REDIS_PASSWORD_请替换为随机串>@redis:6379/0"
      MEDDESK_UPLOAD_DIR: /var/lib/meddesk/data
      # Dockerfile 已把中文字体放到该路径；若构建时未取到字体，PDF 导出会返回 503
      MEDDESK_PDF_FONT_PATH: /opt/meddesk/fonts/NotoSansSC-Regular.ttf
      MEDDESK_LOG_FORMAT: json
      TZ: Asia/Shanghai
    volumes:
      # 上传的密文附件必须持久化（丢失意味着该用户的药物照片不可恢复）
      - appdata:/var/lib/meddesk/data
    # 2C4G 小机：app 512M 足够（Go 运行时 + go-pdf/fpdf 渲染）
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.00
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8089/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - meddesk

# ---------------------------------------------------------------------- 数据卷
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  appdata:
    driver: local

# ------------------------------------------------------------------------ 网络
networks:
  meddesk:
    driver: bridge
