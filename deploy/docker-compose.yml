# ==============================================================================
# MedDesk —— Docker Compose 一键方案（开发 / 自用快速起环境）
# 用法：
#   cp deploy/env.example .env && vim .env        # 必须在 .env 里设置 POSTGRES_PASSWORD / REDIS_PASSWORD / JWT 密钥
#   docker compose -f deploy/docker-compose.yml config        # 先做一次语法/插值校验
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml logs -f app
#
# 【适用 vs 不选】
#   适用：想快速验证功能、家庭 NAS / 小主机、能接受容器化运维的人。
#   不选：追求最小攻击面、已有 PostgreSQL 实例、希望用 systemd + journald 统一运维的人
#         —— 请走 deploy/systemd/meddesk.service 方案（见 docs/DEPLOYMENT.md 路径 B）。
#
# 【安全提醒】
#   1. postgres / redis / app 的端口**全部只映射在 127.0.0.1**，容器网络不出宿主机，
#      对外 HTTPS 必须由 Nginx 反代提供（见 deploy/nginx/meddesk.conf）。
#   2. 口令单一来源：postgres 的 POSTGRES_PASSWORD 与 app 的 MEDDESK_DB_URL 引用同一个
#      .env 变量（Redis 同理用 REDIS_PASSWORD）。变量缺省时 compose 直接报错，不会带病启动。
#      口令将拼进连接串，请只用 URL 安全字符（推荐 openssl rand -hex 24）。
#   3. compose 文件路径在 deploy/ 下，故 volumes 中的相对路径均相对 deploy/ 解析。
# ==============================================================================

name: meddesk

services:
  # ------------------------------------------------------------------ 数据库
  postgres:
    image: postgres:18-alpine
    container_name: meddesk-postgres
    restart: unless-stopped
    # 只监听回环，避免容器端口映射把 5432 暴露到宿主机公网网卡
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: meddesk
      # 【为什么】口令只从 .env 的 POSTGRES_PASSWORD 取值，且用 :? 断言必填：
      #   ① 原先这里写死占位符，与 app 的 MEDDESK_DB_URL 里的占位符是**两个**独立字符串，
      #      永远不可能对上 → app 必然认证失败；
      #   ② :? 让 .env 漏配时 compose 直接报错退出（fail-fast），胜过容器起来后反复重连失败；
      #   ③ 变量名与 docker-compose.middleware.yml 保持一致，同一份 .env 两个编排都能用。
      # 注意：app 的连接串由本变量拼装，故口令必须是 URL 安全字符（推荐 openssl rand -hex 24）。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: meddesk
      # 该变量仅在数据目录为空（首次初始化）时生效，之后修改不会重建库
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Shanghai
      PGDATA: /var/lib/postgresql/data/pgdata
    # 用命令行 -c 覆盖关键参数，避免依赖镜像是否支持 conf.d include_dir。
    # 完整调优说明见 deploy/postgres-tuning.conf（路径 B 的宿主机 PG 用那一份）。
    command: >
      postgres
      -c listen_addresses='*'
      -c max_connections=100
      -c shared_buffers=512MB
      -c effective_cache_size=1GB
      -c work_mem=8MB
      -c maintenance_work_mem=256MB
      -c wal_buffers=16MB
      -c checkpoint_timeout=15min
      -c max_wal_size=2GB
      -c min_wal_size=128MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c log_min_duration_statement=1000
      -c log_timezone='Asia/Shanghai'
      -c timezone='Asia/Shanghai'
    volumes:
      # 数据持久化：命名卷。docker compose down 不删；`down -v` 才会删除（危险！）
      - pgdata:/var/lib/postgresql/data
      # 首次初始化时执行的 SQL（建 citext 扩展等）；仅数据目录为空时执行一次。
      # 内容见 deploy/scripts/initdb/，不需要可整段注释掉。
      - ./scripts/initdb:/docker-entrypoint-initdb.d:ro
    # 2C4G 小机资源限制：给 PG 约 1G，其余留给 redis + app + 系统
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: 1.00
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meddesk -d meddesk -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - meddesk

  # ------------------------------------------------------------ 缓存 / 限流
  redis:
    image: redis:7-alpine
    container_name: meddesk-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      # 【为什么】健康检查里的 redis-cli 需要口令，且必须与 --requirepass 同源；
      # 原先写死占位符，既改不动也与命令行的口令不一致。现统一取 .env 的 REDIS_PASSWORD。
      REDISCLI_AUTH: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
    # 纯缓存语义：关闭 RDB/AOF。Redis 挂掉最坏情况是退化为进程内 Noop 实现
    # （限流与吊销名单在单实例内仍可用），数据本体始终在 PG 里。
    command: >
      redis-server
      --bind 127.0.0.1 -::1
      --appendonly no
      --save ""
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass "${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}"
    volumes:
      - redisdata:/data
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.50
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDISCLI_AUTH\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - meddesk

  # -------------------------------------------------------------------- 应用
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: meddesk:local
    container_name: meddesk-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8089:8089"
    # 仓库根目录的 .env（口令、JWT 密钥等全部从这里来）。
    # 【为什么保留 env_file】它负责其余几十项非口令配置；但注意 compose 优先级是
    #   environment > env_file，所以下面 environment 里**只放必须覆盖的项**。
    env_file:
      - ../.env
    environment:
      # 容器网络内用服务名互访，**不能再写 127.0.0.1**
      MEDDESK_ENV: prod
      MEDDESK_HTTP_ADDR: ":8089"
      MEDDESK_TRUST_PROXY: "true"
      # 【P0 修复】连接串改为**由 POSTGRES_PASSWORD 现场拼装**，不再写死占位符：
      #   - 原写法 environment 里的 MEDDESK_DB_URL 会盖掉 env_file 里 install.sh 写入的
      #     真实连接串，容器拿字面量 "<PG_PASSWORD_请替换为随机串>" 连库，必然失败；
      #   - 现在 postgres 的 POSTGRES_PASSWORD 与本连接串引用同一个变量，
      #     从根上消除"两处占位符对不上"，改一次口令两处同时生效；
      #   - ${...:?} 是必填断言：.env 漏配时 compose config 阶段即报错，不会静默起来再挂。
      MEDDESK_DB_URL: "postgres://meddesk:${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/meddesk?sslmode=disable"
      MEDDESK_REDIS_ENABLED: "true"
      MEDDESK_REDIS_URL: "redis://:${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}@redis:6379/0"
      MEDDESK_UPLOAD_DIR: /var/lib/meddesk/data
      # Dockerfile 已把中文字体放到该路径；若构建时未取到字体，PDF 导出会返回 503
      MEDDESK_PDF_FONT_PATH: /opt/meddesk/fonts/NotoSansSC-Regular.ttf
      MEDDESK_LOG_FORMAT: json
      TZ: Asia/Shanghai
    volumes:
      # 上传的密文附件必须持久化（丢失意味着该用户的药物照片不可恢复）
      - appdata:/var/lib/meddesk/data
    # 2C4G 小机：app 512M 足够（Go 运行时 + go-pdf/fpdf 渲染）
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.00
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8089/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - meddesk

# ---------------------------------------------------------------------- 数据卷
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  appdata:
    driver: local

# ------------------------------------------------------------------------ 网络
networks:
  meddesk:
    driver: bridge
