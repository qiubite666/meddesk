# ==============================================================================
# MedDesk —— Nginx 站点配置
# 目标路径：/etc/nginx/conf.d/meddesk.conf
# 生效方式：nginx -t && systemctl reload nginx
#
# 【部署前必须替换的占位符】
#   med.example.com        -> 你的真实域名（全文替换，共 3 处 server_name）
#   /etc/letsencrypt/...   -> acme.sh 实际安装的证书路径（见 docs/DEPLOYMENT.md 第 6 步）
#   /var/www/meddesk       -> 静态资源根目录（若用 Go 内嵌 + 反代，可保持注释状态）
#
# 【设计要点】
#   1. HTTP:80 只做一件事：ACME 挑战放行，其余 307 跳 HTTPS（保留方法，避免 POST 变 GET）
#      —— 若你希望浏览器永久缓存跳转，把 307 改成 301（但注意 301 会被浏览器长期缓存）。
#   2. TLS：只开 TLSv1.2/1.3，ECDSA(ECC) 证书优先，开启 HTTP/2 与 OCSP stapling。
#   3. 反向代理到 Go 应用 127.0.0.1:8089（MEDESK_HTTP_ADDR 默认值）。
#   4. 静态资源（带内容哈希的 /assets/）长缓存 immutable；index.html 与 sw.js 必须 no-cache。
#   5. 上传体积分两档：普通接口 12m（>= MEDESK_UPLOAD_MAX_BYTES 默认 8 MiB，留 multipart 余量）；
#      WebDAV 网盘单独 200m，对齐后端 webdavUploadLimit = 200 MiB，否则大文件会被 nginx 413。
#   6. 安全头：HSTS / CSP / X-Content-Type-Options / Referrer-Policy / Permissions-Policy。
#      CSP 为「零外链」策略：只允许同源资源，禁止一切第三方域。
#      应用层也会下发同名头且取值冲突，统一由 nginx 侧 proxy_hide_header 去重，以本文件为准。
# ==============================================================================

# ------------------------------------------------------------------------------
# JSON 访问日志格式 meddesk_json
# 【为什么放在文件最前面】nginx 按顺序解析配置，日志格式必须定义在引用它的
# access_log 之前；若定义跑到 access_log 之后，`nginx -t` 会直接报
# unknown log format "meddesk_json" 而启动失败（原先就踩了这个坑）。
# 本文件由 nginx.conf 的 http{} 内 include conf.d/*.conf 引入，因此此处即 http 上下文。
# 全文只允许存在这一处定义：同名格式重复定义会报 duplicate log format。
# ------------------------------------------------------------------------------
log_format meddesk_json escape=json
  '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request_id":"$http_x_request_id",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"body_bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"referrer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"tls":"$ssl_protocol/$ssl_cipher"'
  '}';

# ------------------------------------------------------------------------------
# 限流 zone（第二层防护；第一层在 Go 应用内 ventricle middleware.RateLimit）
#   $binary_remote_addr 为键，即按客户端 IP 限流。
#   mediapi:   普通 API，每秒 10 个请求，突发 30。
#   medauth:   鉴权类接口，每分钟 10 个请求（防爆破）。
#   medexport: 导出/上传等重接口，每分钟 10 个请求。
# 注意：这是第二层防护；第一层是 Go 应用内的 middleware.RateLimit
#       （受 MEDESK_RATE_LIMIT_RPS / MEDESK_RATE_LIMIT_BURST 控制，默认 20/60）。
# 注意：若 Nginx 不在最外层（前面还有 CDN/负载均衡），需先配 ngx_http_realip_module
#       还原真实客户端 IP，并把应用的 MEDESK_TRUST_PROXY 设为 true，
#       否则所有请求在应用看来都来自网关 IP，限流会误伤全体用户。
# ------------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=mediapi:10m   rate=10r/s;
limit_req_zone $binary_remote_addr zone=medauth:10m   rate=10r/m;
limit_req_zone $binary_remote_addr zone=medexport:10m rate=10r/m;
# 令牌刷新单独一档：一个账号同时开多个标签页/多台设备，各自独立刷新属于正常行为。
# 沿用登录的 10r/m + burst=5 时，5 个标签页同时刷新就把额度打满，第 6 个直接 429
# （而前端历史上会把 429 当"登录失效"）。30r/m + burst=15 可容纳 15 个并发刷新。
limit_req_zone $binary_remote_addr zone=medrefresh:10m rate=30r/m;

# 单连接请求体超过阈值后写临时文件，避免大上传占满内存
client_body_buffer_size 256k;

# ------------------------------------------------------------------------------
# 上游：Go 应用（meddesk.service 默认监听 127.0.0.1:8089）
# keepalive 复用连接，降低高并发下的 TIME_WAIT。
# 注意：要让 keepalive 真正生效，所有 proxy_pass 处都不能无条件发
#       Connection: upgrade（那会强制 nginx 每个请求新建 TCP）。
# ------------------------------------------------------------------------------
upstream meddesk_app {
    server 127.0.0.1:8089;
    keepalive 32;
}

# ============================== HTTP :80 =====================================
# 证书使用 acme.sh DNS-01 验证，不需要 80 端口挑战路径 —— 80 只做全量强跳。
# 本机/容器探活请直连应用：curl http://127.0.0.1:8089/api/v1/health（不经 nginx）。
# 307 保留请求方法（不会把 POST 降级成 GET）；稳定后可改 301（浏览器会强缓存）。
server {
    listen 80;
    listen [::]:80;
    server_name med.example.com;

    # —— 可选：公网部署时丢弃未知 Host，减少被扫描探测的面积 ——
    # if ($host != "med.example.com") { return 444; }

    return 307 https://$host$request_uri;
}

# ============================== HTTPS :443 ===================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                       # Nginx >= 1.25.1 的写法；旧版本用 listen 443 ssl http2;
    server_name med.example.com;

    # ---------------------- TLS 证书（acme.sh 安装后的默认路径） ------------------
    # 由 `acme.sh --install-cert -d med.example.com --ecc \
    #        --key-file /etc/letsencrypt/live/med.example.com/privkey.pem \
    #        --fullchain-file /etc/letsencrypt/live/med.example.com/fullchain.pem` 生成。
    # 你要 check 的路径必须与实际安装路径一致（也可写成 acme.sh 推荐的 ~/.acme.sh/... 路径）。
    ssl_certificate     /etc/letsencrypt/live/med.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/med.example.com/privkey.pem;

    # ECC 证书可同时提供 ECDSA + RSA 双证书；若有 RSA 备用证书可在此追加：
    # ssl_certificate     /etc/letsencrypt/live/med.example.com/rsa/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/med.example.com/rsa/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_ecdh_curve X25519:prime256v1;
    ssl_session_cache shared:meddesk_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;                # 关闭 session ticket 以获得前向保密
    ssl_stapling on;                        # OCSP stapling
    ssl_stapling_verify on;
    resolver 1.2.4.8 223.5.5.5 valid=300s;  # 国内可用的 DNS，用于解析 OCSP  responder
    resolver_timeout 5s;

    # ---------------------- 通用限制 ----------------------
    # 上传体上限：需 >= MEDESK_UPLOAD_MAX_BYTES（默认 8388608 = 8 MiB）
    # 这里给 12m：multipart 边界 + iv 字段 + 头部编码会额外占用几十 KB。
    # WebDAV 网盘另有 200m 的独立 location（见下），不在此处放开，
    # 避免把大请求体上限顺带开给所有 API。
    client_max_body_size 12m;
    client_body_timeout  30s;
    send_timeout         60s;

    # ---------------------- 日志 ----------------------
    # meddesk_json 已于文件头部定义，此处可安全引用。
    access_log /var/log/nginx/meddesk.access.log meddesk_json;
    error_log  /var/log/nginx/meddesk.error.log warn;

    # ---------------------- 安全响应头 ----------------------
    # 应用层（internal/middleware/security.go）也会下发一遍，且取值与这里冲突，
    # 因此下面用 proxy_hide_header 把上游那份全部剥掉，只保留本文件这一份：
    #   X-Frame-Options       应用 DENY    vs 此处 SAMEORIGIN
    #   frame-ancestors       应用 'none'  vs 此处 'self'
    #   HSTS                  应用无 preload vs 此处带 preload
    # 同一响应出现两个 X-Frame-Options 时浏览器会整条丢弃，等于没防护。
    # 之所以以 nginx 为准：nginx 还负责静态资源与 4xx/5xx 错误页，口径更一致。
    # Nginx 默认对 4xx/5xx 不追加 add_header，故统一加 always。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(self), payment=(), usb=()" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # CSP：MedDesk 前端「零外链」（无 CDN、无外部字体、无第三方统计），因此可以收紧到同源。
    #   default-src 'self'            所有资源默认同源
    #   img-src 'self' data: blob:    药物照片经 IndexedDB/blob 展示
    #   connect-src 'self'            XHR/fetch 只允许本站 API（禁止外发）
    #   style-src 'self' 'unsafe-inline'   app.css + A8 在 med.js 里注入的 <style>
    #   script-src 'self'             经典脚本全部同源，禁止 eval
    #   object-src / base-uri / form-action 收口防注入与点击劫持
    # 注意：manifest.webmanifest 与 sw.js 均同源，无需额外放开。
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; manifest-src 'self'; worker-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # ---------------------- 上游安全头去重（对所有反代 location 生效） ------------------
    # proxy_hide_header 是「数组型」指令：只要某个 location 里另写了 proxy_hide_header，
    # 就不再继承这一整组。下面 4 个静态资源 location 都写了 Cache-Control 的 hide，
    # 所以它们内部重复了一遍完整列表，务必保持两处一致。
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Strict-Transport-Security;

    # ---------------------- 静态资源 ----------------------
    # 两种形态二选一：
    #   A) 二进制内嵌 web/（默认）：所有静态资源由 Go 直接提供，下面两个 location 不会命中，
    #      请求会落到 location / 的反向代理。此时可整段注释掉。
    #   B) MEDESK_WEB_DIR=/var/www/meddesk：由 Nginx 直接读磁盘，性能更好。
    # 情形 B 时，把 #root /var/www/meddesk; 与下面两个 location 的注释去掉。
    # root /var/www/meddesk;

    # Service Worker 与首页永不过缓存，否则前端发版后用户拿不到新版本。
    # 注意：location 内只要出现任意 add_header，就不再继承 server 级的 add_header，
    # ，HSTS / nosniff / CSP 等会在这条路径（含 4xx/5xx）整体丢失。
    # 因此凡是在 location 内写 add_header 的地方，都必须把安全头补全（并带 always）。
    location = /sw.js {
        # root /var/www/meddesk;
        proxy_pass http://meddesk_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 隐藏应用层 Cache-Control，避免出现重复头；以本层声明为准。
        # 同时补全上游安全头的 hide 列表（否则会中断 server 级的继承）。
        proxy_hide_header Cache-Control;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Strict-Transport-Security;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(self), payment=(), usb=()" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; manifest-src 'self'; worker-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    location = /index.html {
        # root /var/www/meddesk;
        proxy_pass http://meddesk_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 同上：本层写了 add_header，必须自行补齐安全头与上游头去重
        proxy_hide_header Cache-Control;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Strict-Transport-Security;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(self), payment=(), usb=()" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; manifest-src 'self'; worker-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    # 静态资源：服务端已为 index.html 的引用注入 ?v=<构建哈希> 指纹，
    # 指纹变化 → URL 变化 → 浏览器必拉新版本，因此这里的一年期 immutable 是安全的。
    location ^~ /assets/ {
        # alias /var/www/meddesk/assets/;
        proxy_pass http://meddesk_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # 同上：本层写了 add_header，必须自行补齐安全头与上游头去重
        proxy_hide_header Cache-Control;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Strict-Transport-Security;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(self), payment=(), usb=()" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; manifest-src 'self'; worker-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        # 可选：由 Nginx 直接发送静态文件时的压缩开关
        # gzip on;
        # gzip_vary on;
        # gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
        # gzip_min_length 1024;
        access_log off;
    }

    location = /manifest.webmanifest {
        proxy_pass http://meddesk_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 同上：本层写了 add_header，必须自行补齐安全头与上游头去重
        proxy_hide_header Cache-Control;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Strict-Transport-Security;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(self), payment=(), usb=()" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; manifest-src 'self'; worker-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        access_log off;
    }

    # ---------------------- 健康检查（不上限流、不打日志） ----------------------
    location = /api/v1/health {
        proxy_pass http://meddesk_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
    location = /api/v1/ready {
        proxy_pass http://meddesk_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---------------------- 网盘 WebDAV：大文件上传 ----------------------
    # 后端 internal/server/router.go 的 webdavUploadLimit 与 middleware.BodyLimitByPath
    # 都是 200 MiB，而 server 级 client_max_body_size 只有 12m。若不单独放开，
    # 超过 12 MiB 的 PUT 会被 nginx 直接 413，请求根本到不了后端。
    # 用正则 location（正则优先于前缀匹配，故优先于下面的 location /api/），
    # 且只精确匹配 /api/v1/webdav/ 前缀，不会误伤其他 API。
    # 这里刻意不加 limit_req：WebDAV 客户端一次同步会连续发出大量 PROPFIND/PUT/GET，
    # 按 IP 限流会把正常同步打成 429。
    location ~ ^/api/v1/webdav/ {
        client_max_body_size 200m;   # 对齐后端 200 MiB 上限
        # 大文件直传后端，不在 nginx 落磁盘再转发，省一次完整的读写
        proxy_request_buffering off;

        proxy_pass http://meddesk_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 10s;
        # 200 MiB 在慢速上行链路上可能传很久，超时给足 600s（远大于默认 60s）
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # ---------------------- 令牌刷新：单独放宽 ----------------------
    # 用精确匹配（=）而不是正则：nginx 里精确匹配优先级最高，不受下面 auth 正则影响，
    # 也不会因为正则顺序调整而失效。
    location = /api/v1/auth/refresh {
        limit_req zone=medrefresh burst=15 nodelay;
        limit_req_status 429;

        proxy_pass http://meddesk_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ---------------------- 鉴权接口：最严格限流 ----------------------
    location ~ ^/api/v1/auth/(login|register|salt|change-password)$ {
        limit_req zone=medauth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://meddesk_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;   # change-password 要做 argon2id，别设太短
    }

    # ---------------------- 导出 / 附件：重接口限流 ----------------------
    location ~ ^/api/v1/(export|attachments) {
        limit_req zone=medexport burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://meddesk_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_request_buffering on;
        proxy_buffering off;         # 导出 PDF/CSV 流式下发，避免整包入缓冲
        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ---------------------- 其余 API ----------------------
    location /api/ {
        limit_req zone=mediapi burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://meddesk_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 这里原来无条件发 Connection "upgrade"，会让 upstream keepalive 32 完全失效，
        # 每个请求都新建 TCP。本项目没有任何 WebSocket/SSE 端点（已确认 web/ 与 internal/
        # 中不存在 EventSource / WebSocket / text/event-stream），故清空 Connection 以复用长连接。
        # 若将来真的加了 SSE/WS，再单独为其加一个 location 并配 map $http_upgrade $connection_upgrade。
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ---------------------- 前端 SPA 兜底 ----------------------
    location / {
        proxy_pass http://meddesk_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ---------------------- 可选：IP 白名单（家庭/个人自用强烈建议） ----------------------
    # 取消注释并替换为你自己的出口 IP（可用 curl -fsS https://api.ipify.org 查询）。
    # allow 203.0.113.10;
    # allow 198.51.100.0/24;
    # deny all;
    # error_page 403 = /403.html;
}
