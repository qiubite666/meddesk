# ==============================================================================
# MedDesk —— PostgreSQL 16 参数调优片段（面向 2 核 4 GB 小机）
# ==============================================================================
# 用法（宿主机 PostgreSQL，路径 B）：
#   Debian/Ubuntu 官方包（PGDG）：
#     sudo cp deploy/postgres-tuning.conf /etc/postgresql/16/main/conf.d/10-meddesk.conf
#     sudo systemctl restart postgresql
#     验证：sudo -u postgres psql -c "SHOW shared_buffers;"
#   注意：Debian 的 postgresql.conf 里默认有一行 include_dir = 'conf.d'，
#         若没有，请手动在 postgresql.conf 末尾追加一行 include_dir 'conf.d'。
#
# 用法（Docker Compose，路径 A）：
#   官方镜像不保证一定 include conf.d，因此 deploy/docker-compose.yml 里
#   已把这些关键项写成 `command: postgres -c ...` 命令行参数，行为等价。
#   两边请保持一致：数值改一处就要改另一处。
#
# 【调整原则】
#   MedDesk 的数据特征：单用户/家庭级、**写少读少**、表很小（万行量级）、
#   sync_records 有热点更新（同一行被反复 UPDATE）、导出与迁移偶发批量。
#   因此目标是「少内存、少 checkpoint、够用的连接」，而不是吞吐最大化。
#
# 【改完必须看】
#   1) 本文件所有 *_size 单位支持 kB/MB/GB；shared_buffers 不要超过 RAM 的 25%。
#   2) 改 max_connections 要同步调小应用的 MEDDESK_DB_MAX_CONNS（默认 10）。
#      应用连接池上限 × 实例数 必须 < max_connections - superuser_reserved_connections。
#   3) 4 GB 机器上如果还跑了 Redis(256MB) + Nginx + node_exporter，
#      请把 shared_buffers 降到 384MB，effective_cache_size 降到 768MB。
# ==============================================================================

# --------------------------------------------------------------- 监听与时区
listen_addresses = '127.0.0.1'          # 只听本机；如需内网访问改成具体网卡 IP，**不要写 '*'
port = 5432
timezone = 'Asia/Shanghai'
log_timezone = 'Asia/Shanghai'
# MedDesk 的 updated_at 一律存 timestamptz UTC，客户端自行换算，无需改数据库时区

# --------------------------------------------------------------- 内存
# 4 GB 机器取 25% = 1 GB 偏激进（还要留给 Redis），这里取 512MB 更稳。
shared_buffers = 512MB
# 优化器对「操作系统页缓存可用量」的估计，不是真实分配。1GB = 估计有一级缓存可用。
effective_cache_size = 1GB
# 单条查询内单个排序/哈希可用内存。MedDesk 的 pull 会 ORDER BY seq，偶尔导出，
# 8MB 足够；注意它是**每个** sort/hash 节点的上限，复杂查询可能叠加多份。
work_mem = 8MB
# VACUUM / CREATE INDEX / 迁移时的内存。一期只在启动迁移用得上，给大一点迁移更快。
maintenance_work_mem = 256MB
# 临时表/排序落盘前的上限，防止单个失控查询吃完内存
temp_buffers = 16MB

# --------------------------------------------------------------- WAL 与检查点
wal_buffers = 16MB
# 默认 5min 太频繁：sync_records 热点行更新会制造大量 full_page_writes。
# 放宽到 15min + max_wal_size 2GB，可显著降低写放大（代价：崩溃恢复变慢，小机可接受）。
checkpoint_timeout = 15min
max_wal_size = 2GB
min_wal_size = 128MB
checkpoint_completion_target = 0.9
# 一期数据重要性低于可用性：sync_records 全是可重建的密文（真正唯一的是 users 与 attachments 元数据）。
# 但 **attachments 丢了 = 药物照片永久不可恢复**，备份更重要；这里保留 fsync 与 full_page_writes 的默认安全值。
fsync = on
full_page_writes = on
synchronous_commit = on

# --------------------------------------------------------------- 连接
# 应用连接池默认最大 10；留足余量给 psql 运维、备份脚本与监控。
max_connections = 100
superuser_reserved_connections = 3
# 空闲事务会持有锁并阻止 vacuum 清理，家庭场景 5 分钟足够宽限
idle_in_transaction_session_timeout = 300s
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 5

# --------------------------------------------------------------- 优化器（SSD 场景）
# 机械盘请改回 random_page_cost=4.0、effective_io_concurrency=2
random_page_cost = 1.1
seq_page_cost = 1.0
effective_io_concurrency = 200
# MedDesk 数据量很小，join 基本是 nested loop，给 planner 一点余量即可
join_collapse_limit = 8
from_collapse_limit = 8
default_statistics_target = 100

# --------------------------------------------------------------- 并行
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 2
# 一期基本没有并行收益（表太小），保留最低配置仅为迁移建索引时提速

# --------------------------------------------------------------- autovacuum
autovacuum = on
autovacuum_max_workers = 2
# sync_records 更新频繁，把触发阈值压低，避免死元组堆积导致 pull 变慢
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_delay = 10ms
autovacuum_vacuum_cost_limit = 1000
autovacuum_naptime = 30s
# 单表级策略（仅对更新最热的 sync_records 生效，连上 meddesk 库执行一次即可）：
#   ALTER TABLE sync_records SET (
#     autovacuum_vacuum_scale_factor = 0.02,
#     autovacuum_vacuum_threshold = 200,
#     fillfactor = 90);
log_autovacuum_min_duration = 0

# --------------------------------------------------------------- 日志（排障友好）
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000        # 记录慢查询：>1s
log_checkpoints = on
log_connections = off                    # 家庭场景太吵，排障时临时打开
log_disconnections = off
log_lock_waits = on
log_temp_files = 0                       # 打到临时文件的都记下来，便于发现失控 work_mem
log_line_prefix = '%m [%p] %u@%d '
log_statement = 'none'                   # 切勿设 'all'：会记录参数化后的值（虽然都是密文，但属最小化原则）

# --------------------------------------------------------------- 可选：JIT（小查询无收益，直接关）
jit = off
