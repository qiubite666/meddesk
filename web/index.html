<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e9f6e">
  <meta name="description" content="丘比特的工作台，安全、离线优先的个人用药管理工具">
  <title>丘比特的工作台</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <!-- 静态资源引用由服务端启动时注入 ?v=<构建哈希> 指纹，此处保持无版本形式 -->
  <link rel="stylesheet" href="/assets/css/app.css">
</head>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand" id="brand"></div>
      <nav class="sidebar__nav" id="nav-list"></nav>
      <div class="sidebar__foot" id="sidebar-foot"></div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="main">
      <header class="topbar" id="topbar">
        <button class="btn btn-icon" id="btn-menu" type="button" aria-label="打开菜单"></button>
        <h1 id="page-title"></h1>
        <div id="sync-indicator" aria-live="polite"></div>
        <button class="btn btn-icon" id="btn-theme" type="button" aria-label="切换主题"></button>
        <button class="btn btn-icon" id="btn-account" type="button" aria-label="账户"></button>
      </header>
      <main class="main__body" id="app-main"></main>
      <nav class="tabbar" id="tabbar" aria-label="主要导航"></nav>
    </div>
  </div>
  <div id="toast-host" class="toast-host" aria-live="polite"></div>
  <div id="modal-host" class="modal-host" hidden></div>
  <div id="auth-screen" class="auth-screen"></div>

  <script src="/assets/js/core.js" defer></script>
  <script src="/assets/js/crypto.js" defer></script>
  <script src="/assets/js/db.js" defer></script>
  <script src="/assets/js/api.js" defer></script>
  <script src="/assets/js/captcha.js" defer></script>
  <script src="/assets/js/data.js" defer></script>
  <!-- 关联一致性：订阅 data:changed，保证药物改归属/删除后排程与历史跟随。必须紧跟 data.js -->
  <script src="/assets/js/consistency.js" defer></script>
  <script src="/assets/js/sync.js" defer></script>
  <script src="/assets/js/schedule.js" defer></script>
  <script src="/assets/js/remind.js" defer></script>
  <script src="/assets/js/med.js" defer></script>
  <!-- 安卓原生壳适配：三个模块都先探测运行环境，浏览器/PWA 下自动降级为无操作，
       且必须在工具箱容器（tools.js）之前加载，以便共享同一套降级约定。 -->
  <script src="/assets/js/export-share.js" defer></script>
  <script src="/assets/js/export.js" defer></script>
  <script src="/assets/js/native-record.js" defer></script>
  <script src="/assets/js/native-alarm.js" defer></script>
  <!-- 工具箱：容器与共享契约必须早于各工具页加载（工具在脚本执行期即注册） -->
  <script src="/assets/js/tools.js" defer></script>
  <script src="/assets/js/tool-unit-price.js" defer></script>
  <script src="/assets/js/tool-loan.js" defer></script>
  <script src="/assets/js/tool-fuel.js" defer></script>
  <script src="/assets/js/tool-convert.js" defer></script>
  <!-- 健康工具：与「计算工具」同级，各自独立成页，从分类页进入 -->
  <script src="/assets/js/tool-health-bmi.js" defer></script>
  <script src="/assets/js/tool-health-bfp.js" defer></script>
  <script src="/assets/js/tool-health-bmr.js" defer></script>
  <script src="/assets/js/tool-health-ideal-weight.js" defer></script>
  <script src="/assets/js/tool-health-fitness-age.js" defer></script>
  <script src="/assets/js/webdav.js" defer></script>
  <!-- 家庭健康：依赖 data / sched / crypto / core，必须早于 app.js（路由在 app 里注册） -->
  <!-- 家庭健康：family-link 提供 8 位短码与实时拉取，必须先于 family.js 加载 -->
  <script src="/assets/js/family-link.js" defer></script>
  <script src="/assets/js/family.js" defer></script>
  <script src="/assets/js/app.js" defer></script>
  <!-- 记账本：defer 脚本在 DOMContentLoaded 之前执行完成，
       因此它自己注册路由即可，app.js 里不再保留 ledger 占位项（避免重复路由）。 -->
  <script src="/assets/js/ledger.js" defer></script>
</body>
</html>
